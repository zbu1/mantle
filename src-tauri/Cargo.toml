[package]
name = "mantle"
version = "0.1.0"
description = "Backend for mantle application."
authors = ["zanbowie138"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mantle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
mntl-core = { path = "../crates/mntl-core" }
notify = "6"
tauri-plugin-log = { version = "2.9.0", features = ["colored"] }
log = "0.4.34"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1.8"
percent-encoding = "2"
sha2 = "0.10"
tauri-plugin-clipboard-manager = "2"
# ```typst blocks in notes (`typst_render.rs`); the bundled fonts add several MB.
typst = "0.15.1"
typst-layout = "0.15.1"
typst-svg = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
comemo = "0.5.1"
spellbook = "0.4.2"

# Android has no OS trash; deletes there are permanent (`vault::move_to_trash`).
[target.'cfg(not(target_os = "android"))'.dependencies]
trash = "5.2.6"

# Windows Hello unlock (`biometric.rs`).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Security_Credentials", "Security_Cryptography", "Storage_Streams"] }
