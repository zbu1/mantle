<div
  #panel
  style="display: none"
  class="max-h-72 w-56 overflow-y-auto rounded-md border border-border bg-surface p-1 text-surface-foreground shadow-md"
>
  @for (item of items(); track item.id; let i = $index) {
    <button
      type="button"
      class="flex w-full items-center gap-2 rounded px-2 py-1.5 text-left text-sm hover:bg-muted"
      [class.bg-muted]="i === selectedIndex()"
      (click)="select(item)"
    >
      @switch (item.icon) {
        @case ('h1') {
          <svg lucideHeading1 [size]="14"></svg>
        }
        @case ('h2') {
          <svg lucideHeading2 [size]="14"></svg>
        }
        @case ('h3') {
          <svg lucideHeading3 [size]="14"></svg>
        }
        @case ('bullet-list') {
          <svg lucideList [size]="14"></svg>
        }
        @case ('ordered-list') {
          <svg lucideListOrdered [size]="14"></svg>
        }
        @case ('task-list') {
          <svg lucideListTodo [size]="14"></svg>
        }
        @case ('blockquote') {
          <svg lucideQuote [size]="14"></svg>
        }
        @case ('code-block') {
          <svg lucideCode2 [size]="14"></svg>
        }
        @case ('divider') {
          <svg lucideMinus [size]="14"></svg>
        }
      }
      <span>{{ item.label }}</span>
    </button>
  } @empty {
    <div class="px-2 py-1.5 text-sm text-muted-foreground">No matching blocks</div>
  }
</div>
