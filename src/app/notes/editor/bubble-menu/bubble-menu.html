<div #panel class="invisible flex items-center gap-0.5 rounded-md border border-border bg-surface p-1 text-surface-foreground opacity-0 shadow-md">
  @if (!editingLink()) {
    <button
      type="button"
      class="flex items-center justify-center rounded p-1.5 hover:bg-muted"
      [class.bg-muted]="marks().bold"
      (click)="toggleBold()"
    >
      <svg lucideBold [size]="14"></svg>
    </button>
    <button
      type="button"
      class="flex items-center justify-center rounded p-1.5 hover:bg-muted"
      [class.bg-muted]="marks().italic"
      (click)="toggleItalic()"
    >
      <svg lucideItalic [size]="14"></svg>
    </button>
    <button
      type="button"
      class="flex items-center justify-center rounded p-1.5 hover:bg-muted"
      [class.bg-muted]="marks().strike"
      (click)="toggleStrike()"
    >
      <svg lucideStrikethrough [size]="14"></svg>
    </button>
    <button
      type="button"
      class="flex items-center justify-center rounded p-1.5 hover:bg-muted"
      [class.bg-muted]="marks().code"
      (click)="toggleCode()"
    >
      <svg lucideCode [size]="14"></svg>
    </button>
    <div class="mx-0.5 h-4 w-px bg-border"></div>
    <button
      type="button"
      class="flex items-center justify-center rounded p-1.5 hover:bg-muted"
      [class.bg-muted]="marks().link"
      (click)="openLinkEditor()"
    >
      <svg lucideLink [size]="14"></svg>
    </button>
    @if (marks().link) {
      <button type="button" class="flex items-center justify-center rounded p-1.5 hover:bg-muted" (click)="removeLink()">
        <svg lucideUnlink [size]="14"></svg>
      </button>
    }
  } @else {
    <input
      type="text"
      placeholder="Paste a link…"
      class="w-48 rounded border border-border bg-background px-2 py-1 text-xs text-foreground outline-none"
      [value]="linkUrl()"
      (input)="setLinkUrl($any($event.target).value)"
      (keydown.enter)="confirmLink()"
      (keydown.escape)="cancelLink()"
    />
    <button type="button" class="flex items-center justify-center rounded p-1.5 hover:bg-muted" (click)="confirmLink()">
      <svg lucideCheck [size]="14"></svg>
    </button>
    <button type="button" class="flex items-center justify-center rounded p-1.5 hover:bg-muted" (click)="cancelLink()">
      <svg lucideX [size]="14"></svg>
    </button>
  }
</div>
