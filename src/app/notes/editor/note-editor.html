<div class="relative h-full text-sm text-foreground/90">
  <div #mount class="h-full min-w-0 w-full"></div>
  @if (entryStatus(); as status) {
  @if (status === 'loading') {
  <div class="absolute inset-0 flex items-center justify-center bg-background/60 text-xs text-muted-foreground">
    Loading note…
  </div>
  } @else if (status === 'error') {
  <div class="absolute inset-0 flex items-center justify-center bg-background/80 text-xs text-destructive">
    Failed to load note.
  </div>
  }
  }
  <app-slash-menu #slashMenu />
  @if (languagePicker(); as picker) {
  <app-code-language-picker [anchor]="picker.anchor" [current]="picker.current" (picked)="onLanguagePicked($event)"
    (closed)="languagePicker.set(null)" />
  }
</div>
