<div class="frame flex h-screen flex-col text-foreground">
  @if (isMobile) {
  <app-mobile-shell />
  } @else if (vaultRoot.isOpen() && !vaultState.managing()) {
  <app-header />
  <div class="flex flex-1 overflow-hidden">
    <app-icon-rail />
    <app-sidebar />
    <main #editorBoundary class="shadow-card mr-2 mb-2 flex-1 overflow-hidden rounded-xl border border-input bg-background">
      <app-pane-layout [node]="tabsState.layout()" />
    </main>
  </div>
  } @else {
  <app-welcome />
  }
  <app-context-menu />
  <app-encryption-panel />
  @if (isMobile) {
  <app-mobile-dialog />
  } @else {
  <app-dialog />
  }
  <app-new-encrypted-note />
  <app-note-encryption-modal />
  <app-markdown-export-modal />
  <app-history-modal />
  <app-item-style-picker />
  <app-settings-modal />
  <app-vault-drag-preview />
  <app-quick-switcher />
  <app-toast />
  <app-command-palette />
  @if (!isMobile) {
  <!-- Hover tooltips have no hover to follow on a touchscreen. -->
  <app-hover-tooltip-host />
  }
  <app-folder-picker />
</div>
