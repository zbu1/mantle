<header class="grid h-9 shrink-0 grid-cols-[auto_1fr_auto] select-none border-b border-border bg-surface text-surface-foreground">
  <div class="flex items-center">
    <button
      type="button"
      title="Toggle sidebar"
      (click)="toggleSidebar()"
      class="inline-flex w-11 items-center justify-center text-foreground hover:bg-background"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="16" rx="2" />
        <line x1="9" y1="4" x2="9" y2="20" />
      </svg>
    </button>
  </div>
  <div data-tauri-drag-region class="flex items-center pl-2 text-sm font-semibold text-foreground [app-region:drag]">
    Stash
  </div>
  <div class="flex">
    <button
      type="button"
      title="Minimize"
      (click)="minimize()"
      class="inline-flex w-11 items-center justify-center text-foreground hover:bg-background"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24">
        <path fill="currentColor" d="M19 13H5v-2h14z" />
      </svg>
    </button>
    <button
      type="button"
      title="Maximize"
      (click)="toggleMaximize()"
      class="inline-flex w-11 items-center justify-center text-foreground hover:bg-background"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24">
        <path fill="currentColor" d="M4 4h16v16H4zm2 4v10h12V8z" />
      </svg>
    </button>
    <button
      type="button"
      title="Close"
      (click)="close()"
      class="inline-flex w-11 items-center justify-center text-foreground hover:bg-destructive hover:text-destructive-foreground"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24">
        <path fill="currentColor" d="M13.46 12L19 17.54V19h-1.46L12 13.46L6.46 19H5v-1.46L10.54 12L5 6.46V5h1.46L12 10.54L17.54 5H19v1.46z" />
      </svg>
    </button>
  </div>
</header>
