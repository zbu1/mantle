<header class="relative grid h-10 shrink-0 select-none text-surface-foreground"
  [style.grid-template-columns]="gridTemplateColumns()" [style.transition]="layoutTransition()">
  <div class="flex min-w-0 items-center gap-1 pl-2 pr-1">
    <app-main-menu />
  </div>
  <button type="button" title="Toggle sidebar" (click)="toggleSidebar()"
    class="absolute top-1 z-10 inline-flex h-8 w-8 items-center justify-center rounded-md text-foreground hover:bg-background"
    [style.left.px]="toggleButtonLeft()" [style.transition]="toggleTransition()">
    <svg lucidePanelLeft [size]="14"></svg>
  </button>
  <div data-tauri-drag-region
    class="flex min-w-0 items-stretch gap-1 overflow-x-auto rounded-bl-xl border-border pr-1 [app-region:drag]"
    [style.padding-left.px]="tabsPaddingLeft()" [style.transition]="tabsPaddingTransition()">
    @if (tabsState.tabs().length > 0) {
    @for (tab of tabsState.tabs(); track tab.id) {
    <button type="button" (click)="activateTab(tab.id)" (contextmenu)="tabMenu.open($event, tab)"
      [title]="tab.missing ? tab.title + ' — file not found (moved or deleted outside Mantle)' : tab.title"
      class="group my-1 flex min-w-0 max-w-48 shrink-0 items-center gap-2 rounded-md border border-input px-3 text-xs"
      [class.bg-background]="tab.id === tabsState.activeId()" [class.text-foreground]="tab.id === tabsState.activeId()"
      [class.tab-active-rule]="tab.id === tabsState.activeId()"
      [class.text-muted-foreground]="tab.id !== tabsState.activeId()"
      [class.hover:bg-background/60]="tab.id !== tabsState.activeId()" [class.opacity-60]="tab.missing">
      <span class="min-w-0 flex-1 truncate text-left" [class.line-through]="tab.missing">{{ tab.title }}</span>
      <span (click)="closeTab($event, tab.id)"
        class="flex shrink-0 items-center justify-center rounded p-0.5 opacity-0 hover:bg-border group-hover:opacity-100">
        <svg lucideX [size]="12"></svg>
      </span>
    </button>
    }
    } @else {
    <div class="flex items-center pl-2 text-sm font-semibold tracking-tight text-foreground">Mantle<span class="text-primary">.</span></div>
    }
    <button type="button" title="New note" (click)="onNewNote()"
      class="my-1 inline-flex h-7 w-7 shrink-0 items-center justify-center self-center rounded-md text-muted-foreground hover:bg-background/60 hover:text-foreground">
      <svg lucidePlus [size]="14"></svg>
    </button>
  </div>
  <app-window-controls />
</header>
