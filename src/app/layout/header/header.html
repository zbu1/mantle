<header class="grid h-10 shrink-0 select-none bg-surface text-surface-foreground"
  [style.grid-template-columns]="gridTemplateColumns()">
  <div class="flex items-center">
    <button type="button" title="Toggle sidebar" (click)="toggleSidebar()"
      class="inline-flex w-11 items-center justify-center text-foreground hover:bg-background">
      <svg lucidePanelLeft [size]="14"></svg>
    </button>
  </div>
  <div data-tauri-drag-region
    class="flex min-w-0 items-stretch gap-1 overflow-x-auto rounded-bl-xl border-border px-1 [app-region:drag]">
    @if (tabsState.tabs().length > 0) {
    @for (tab of tabsState.tabs(); track tab.id) {
    <button type="button" (click)="activateTab(tab.id)"
      [title]="tab.missing ? tab.title + ' — file not found (moved or deleted outside Mantle)' : tab.title"
      class="group my-1 flex min-w-0 max-w-48 shrink-0 items-center gap-2 rounded-md border border-border px-3 text-xs"
      [class.bg-background]="tab.id === tabsState.activeId()" [class.text-foreground]="tab.id === tabsState.activeId()"
      [class.text-muted-foreground]="tab.id !== tabsState.activeId()"
      [class.hover:bg-background/60]="tab.id !== tabsState.activeId()" [class.opacity-60]="tab.missing">
      <span class="min-w-0 flex-1 truncate text-left" [class.line-through]="tab.missing">{{ tab.title }}</span>
      <span (click)="closeTab($event, tab.id)"
        class="flex shrink-0 items-center justify-center rounded p-0.5 opacity-0 hover:bg-border group-hover:opacity-100">
        <svg lucideX [size]="12"></svg>
      </span>
    </button>
    }
    } @else {
    <div class="flex items-center pl-2 text-sm font-semibold text-foreground">Mantle</div>
    }
    <button type="button" title="New note" (click)="onNewNote()"
      class="my-1 inline-flex h-7 w-7 shrink-0 items-center justify-center self-center rounded-md text-muted-foreground hover:bg-background/60 hover:text-foreground">
      <svg lucidePlus [size]="14"></svg>
    </button>
  </div>
  <div class="flex">
    <button type="button" title="Minimize" (click)="minimize()"
      class="inline-flex w-11 items-center justify-center text-foreground hover:bg-background">
      <svg lucideMinus [size]="14"></svg>
    </button>
    <button type="button" [title]="isMaximized() ? 'Restore Down' : 'Maximize'" (click)="toggleMaximize()"
      class="inline-flex w-11 items-center justify-center text-foreground hover:bg-background">
      @if (isMaximized()) {
      <svg lucideCopy [size]="12" class="-scale-x-100"></svg>
      } @else {
      <svg lucideSquare [size]="12"></svg>
      }
    </button>
    <button type="button" title="Close" (click)="close()"
      class="inline-flex w-11 items-center justify-center text-foreground hover:bg-destructive hover:text-destructive-foreground">
      <svg lucideX [size]="16"></svg>
    </button>
  </div>
</header>
