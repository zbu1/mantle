<header
  class="grid h-9 shrink-0 grid-cols-[auto_1fr_auto] select-none border-b border-border bg-surface text-surface-foreground">
  <div class="flex items-center">
    <button type="button" title="Toggle sidebar" (click)="toggleSidebar()"
      class="inline-flex w-11 items-center justify-center text-foreground hover:bg-background">
      <svg lucidePanelLeft [size]="14"></svg>
    </button>
  </div>
  <div data-tauri-drag-region class="flex items-center pl-2 text-sm font-semibold text-foreground [app-region:drag]">
    Mantle
  </div>
  <div class="flex">
    <button type="button" title="Minimize" (click)="minimize()"
      class="inline-flex w-11 items-center justify-center text-foreground hover:bg-background">
      <svg lucideMinus [size]="14"></svg>
    </button>
    <button type="button" [title]="isMaximized() ? 'Restore Down' : 'Maximize'" (click)="toggleMaximize()"
      class="inline-flex w-11 items-center justify-center text-foreground hover:bg-background">
      @if (isMaximized()) {
      <svg lucideCopy [size]="12" class="-scale-x-100"></svg>
      } @else {
      <svg lucideSquare [size]="12"></svg>
      }
    </button>
    <button type="button" title="Close" (click)="close()"
      class="inline-flex w-11 items-center justify-center text-foreground hover:bg-destructive hover:text-destructive-foreground">
      <svg lucideX [size]="16"></svg>
    </button>
  </div>
</header>
