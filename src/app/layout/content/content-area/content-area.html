<div class="flex h-full flex-col">
  @if (tabsState.tabs().length > 0) {
    <div class="flex shrink-0 items-stretch overflow-x-auto border-b border-border bg-muted">
      @for (tab of tabsState.tabs(); track tab.id) {
        <button
          type="button"
          (click)="activateTab(tab.id)"
          [title]="tab.title"
          class="group flex min-w-0 max-w-48 shrink-0 items-center gap-2 border-r border-border px-3 py-1.5 text-xs"
          [class.bg-background]="tab.id === tabsState.activeId()"
          [class.text-foreground]="tab.id === tabsState.activeId()"
          [class.text-muted-foreground]="tab.id !== tabsState.activeId()"
          [class.hover:bg-background/60]="tab.id !== tabsState.activeId()"
        >
          <span class="min-w-0 flex-1 truncate text-left">{{ tab.title }}</span>
          <span
            (click)="closeTab($event, tab.id)"
            class="flex shrink-0 items-center justify-center rounded p-0.5 opacity-0 hover:bg-border group-hover:opacity-100"
          >
            <svg lucideX [size]="12"></svg>
          </span>
        </button>
      }
    </div>
  }

  <div class="flex-1 overflow-y-auto p-6">
    @if (activeNote(); as note) {
      <h1 class="mb-4 text-lg font-semibold text-foreground">{{ note.title }}</h1>
      <p class="whitespace-pre-line text-sm text-foreground/90">{{ note.content }}</p>
    } @else {
      <div class="flex h-full items-center justify-center text-sm text-muted-foreground">
        No notes open — select one from the sidebar.
      </div>
    }
  </div>
</div>
