<div class="group/row flex w-full items-center gap-1.5 rounded-md py-1 pr-2 text-xs text-foreground/80 hover:bg-background hover:text-foreground">
  <button type="button" [attr.draggable]="draggable() ? 'true' : null" (dragstart)="onDragStart($event)"
    (contextmenu)="onContextMenu($event)" (click)="toggle.emit()" [attr.aria-expanded]="expanded()"
    [style.padding-left.px]="36 + depth() * 16" class="flex min-w-0 flex-1 items-center gap-1.5 text-left">
    <svg lucideChevronRight [size]="12" class="shrink-0 transition-transform duration-200"
      [class.rotate-90]="expanded()"></svg>
    <ng-content select="[explorerIcon]" />
    <span class="truncate">{{ label() }}</span>
    <ng-content select="[explorerTrailing]" />
  </button>
  <ng-content select="[explorerAction]" />
</div>
