<button #button type="button" [attr.title]="suppressNativeTitle() ? null : label()" (click)="onClick($event)" (mousedown)="onMouseDown($event)" (auxclick)="onAuxClick($event)" (contextmenu)="onContextMenu($event)" (blur)="onBlur()"
  [attr.aria-current]="active() ? 'page' : null" [class]="buttonClass()"
  [style.padding-left.px]="collapsed() ? null : baseIndent() + indent()">
  <span class="shrink-0 text-muted-foreground empty:hidden"><ng-content select="[sidebarItemIcon]" /></span>
  @if (!collapsed()) {
  <span class="min-w-0 flex-1 truncate">@if (labelParts(); as parts) {{{ parts[0] }}<mark class="rounded-[2px] bg-primary/20 text-inherit">{{ parts[1] }}</mark>{{ parts[2] }}} @else {{{ label() }}}@if (labelSuffix(); as suffix) {<span class="font-normal text-muted-foreground/70">{{ suffix }}</span>}</span>
  <ng-content select="[sidebarItemTrailing]" />
  }
</button>
