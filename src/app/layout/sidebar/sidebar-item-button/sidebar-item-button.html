<button #button type="button" [title]="suppressNativeTitle() ? null : label()" (click)="onClick($event)" (mousedown)="onMouseDown($event)" (auxclick)="onAuxClick($event)" (contextmenu)="onContextMenu($event)" (blur)="onBlur()"
  class="flex items-center gap-2 rounded-md text-xs text-foreground/80"
  [class]="(collapsed() ? 'h-9 w-full justify-center' : 'w-full pr-2 py-1.5 text-left') + (selected() ? ' relative bg-primary/10 text-foreground before:absolute before:inset-y-1.5 before:left-0 before:w-0.5 before:rounded-full before:bg-primary' :' hover:bg-surface hover:text-foreground') + (forceFocusRing() ? ' focus-ring-forced' : '')"
  [style.padding-left.px]="collapsed() ? null : 36 + indent()">
  <span class="shrink-0 text-muted-foreground">
    <ng-content select="[sidebarItemIcon]" />
  </span>
  @if (!collapsed()) {
  <span class="min-w-0 flex-1 truncate">{{ label() }}@if (labelSuffix(); as suffix) {<span class="text-muted-foreground/70">{{ suffix }}</span>}</span>
  <ng-content select="[sidebarItemTrailing]" />
  }
</button>
