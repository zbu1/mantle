<nav class="flex w-56 shrink-0 flex-col gap-1 border-r border-border bg-surface p-3">
  @for (item of navItems; track item.path) {
    <a
      [routerLink]="item.path"
      routerLinkActive="bg-accent text-accent-fg"
      [routerLinkActiveOptions]="{ exact: item.path === '/' }"
      class="rounded-md px-3 py-2 text-sm text-fg hover:bg-bg"
    >
      {{ item.label }}
    </a>
  }
</nav>
