<div class="flex flex-col">
  <button type="button" (click)="toggle()"
    class="flex items-center gap-1.5 rounded-md px-2 py-1.5 text-xs font-semibold uppercase tracking-wide text-muted-foreground hover:bg-background hover:text-foreground">
    <svg lucideChevronRight [size]="12" class="shrink-0 transition-transform duration-150"
      [class.rotate-90]="expanded()"></svg>
    <span class="shrink-0">
      <ng-content select="[sidebarSectionIcon]" />
    </span>
    <span>{{ label() }}</span>
  </button>

  @if (expanded()) {
  <div class="mt-0.5 flex flex-col gap-0.5 pl-7 pr-1">
    <ng-content />
  </div>
  }
</div>
