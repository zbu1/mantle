<button type="button" (click)="toggle()" (contextmenu)="onHeaderContextMenu($event)" [attr.aria-expanded]="expanded()"
  class="group/section flex h-7 w-full mobile:h-10 mobile:text-xs min-w-0 shrink-0 items-center gap-1.5 rounded-md px-2 text-[11px] font-medium text-muted-foreground transition-colors hover:text-foreground">
  <svg lucideChevronRight [size]="11" class="shrink-0 text-muted-foreground/60 transition-transform duration-200 group-hover/section:text-foreground"
    [class.rotate-90]="expanded()"></svg>
  <span class="min-w-0 flex-1 truncate text-left">{{ label() }}</span>
  @if (count(); as count) {
  <span class="shrink-0 tabular-nums text-muted-foreground/60">{{ count }}</span>
  }
</button>

@if (expanded()) {
<div class="flex flex-col pb-1">
  <ng-content />
</div>
}
