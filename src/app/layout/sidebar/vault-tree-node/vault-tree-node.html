@if (asFolder(); as folder) {
<div (dragenter)="onFolderDragOver(folder, $event)" (dragover)="onFolderDragOver(folder, $event)" (drop)="onFolderDrop(folder, $event)"
  [class.bg-primary/10]="dragState.hoveredDir() === folder.relPath" class="rounded-md">
  @if (renaming()) {
  <div [style.padding-left.px]="36 + depth() * 16" class="flex w-full items-center gap-1.5 rounded-md py-1 pr-2">
    <svg lucideChevronRight [size]="12" class="shrink-0" [class.rotate-90]="expanded()"></svg>
    <svg lucideFolder [size]="14" class="shrink-0 text-muted-foreground"></svg>
    <input #renameInput type="text" [value]="folder.name" (keydown)="onRenameKeydown($event)"
      (blur)="onFolderRenameBlur(folder, renameInput.value)" (click)="$event.stopPropagation()"
      class="w-full min-w-0 flex-1 rounded-sm border border-primary/50 bg-background px-1 py-0 text-xs text-foreground outline-none" />
  </div>
  } @else {
  <app-explorer-row [label]="folder.name" [depth]="depth()" [expanded]="expanded()" [draggable]="true"
    (toggle)="toggleExpanded()" (headerDragStart)="onFolderDragStart(folder, $event)"
    (headerContextMenu)="folderContextMenu.emit({ event: $event, folder })">
    <svg explorerIcon lucideFolder [size]="14" class="shrink-0 text-muted-foreground"></svg>
  </app-explorer-row>
  }
  <app-explorer-body [expanded]="expanded()">
    <div class="p-0.5">
      <div class="relative">
        <div class="pointer-events-none absolute top-0 bottom-0 z-10 w-px bg-border" [style.left.px]="36 + depth() * 16 + 6"></div>
        @for (child of folder.children; track child.relPath) {
        <app-vault-tree-node [node]="child" [depth]="depth() + 1" [unlockedProfiles]="unlockedProfiles()"
          (openNote)="openNote.emit($event)" (openNoteInBackground)="openNoteInBackground.emit($event)"
          (noteContextMenu)="noteContextMenu.emit($event)" (folderContextMenu)="folderContextMenu.emit($event)"
          (lockedClicked)="lockedClicked.emit($event)" (notesDropped)="notesDropped.emit($event)"
          (folderDropped)="folderDropped.emit($event)" (noteRenamed)="noteRenamed.emit($event)"
          (folderRenamed)="folderRenamed.emit($event)" />
        }
      </div>
    </div>
  </app-explorer-body>
</div>
} @else if (asNote(); as note) {
<div [attr.data-note-path]="note.relPath" [draggable]="!renaming()" (dragstart)="onNoteDragStart(note, $event)">
  @if (renaming()) {
  <div [style.padding-left.px]="depth() * 16 + 44" class="flex items-center gap-2 py-1.5 pr-2">
    <svg class="shrink-0 text-muted-foreground" lucideFileText [size]="14"></svg>
    <input #renameInput type="text" [value]="note.name" (keydown)="onRenameKeydown($event)"
      (blur)="onNoteRenameBlur(note, renameInput.value)" (click)="$event.stopPropagation()"
      class="w-full min-w-0 flex-1 rounded-sm border border-primary/50 bg-background px-1 py-0 text-xs text-foreground outline-none" />
  </div>
  } @else {
  <app-sidebar-item-button [label]="note.name" [selected]="selectionState.isSelected(note.relPath)"
    [indent]="depth() * 16 + 8" [suppressNativeTitle]="true" [appHoverTooltip]="note.name"
    [appHoverTooltipSublabel]="encryptionStatus(note)" (clicked)="onNoteClick(note, $event)"
    (middleClicked)="openNoteInBackground.emit(note)" (contextMenu)="onNoteContextMenu(note, $event)">
    @if (isLocked(note)) {
    <svg sidebarItemIcon lucideLock [size]="13" class="shrink-0"></svg>
    } @else if (note.encrypted) {
    <svg sidebarItemIcon lucideLockOpen [size]="13" class="shrink-0 text-primary"></svg>
    } @else {
    <svg sidebarItemIcon lucideFileText [size]="14" class="shrink-0"></svg>
    }
    @if (note.encrypted) {
    <span sidebarItemTrailing class="shrink-0 truncate pl-1 text-[11px] text-muted-foreground">{{ profileName(note) }}</span>
    }
  </app-sidebar-item-button>
  }
</div>
}
