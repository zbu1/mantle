<app-sidebar-section id="credentials" label="Credential Profiles" [count]="profiles().length">

  <div class="flex flex-col" (contextmenu)="onBackgroundContextMenu($event)">
    @for (profile of profiles(); track profile.id) {
    <app-credential-profile-row [profileId]="profile.id" [displayName]="profile.displayName" [notes]="profile.notes"
      [hiddenCount]="profile.hiddenCount" [unlocked]="profile.unlocked" (openNote)="openNote.emit($event)" (noteContextMenu)="noteContextMenu.emit($event)" />
    }

    @if (orphans().length > 0) {
    <div class="px-2 pt-2 text-[11px] font-medium text-muted-foreground">Unknown</div>
    @for (group of orphans(); track group.profileId) {
    <app-credential-profile-row [profileId]="group.profileId"
      [displayName]="group.profileId ?? 'Unreadable'" [notes]="group.notes" [hiddenCount]="group.hiddenCount" [unknown]="true"
      (noteContextMenu)="noteContextMenu.emit($event)" />
    }
    }

    @if (profiles().length === 0 && orphans().length === 0) {
    <p class="px-2 py-1 text-xs text-muted-foreground">
      No profiles yet — right-click here to create one.
    </p>
    }

    @if (anyUnlocked()) {
    <app-sidebar-item-button label="Lock all" (clicked)="onLockAll()">
      <svg sidebarItemIcon lucideLock [size]="14" class="shrink-0"></svg>
    </app-sidebar-item-button>
    }
  </div>
</app-sidebar-section>
