@if (request(); as req) {
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50" (pointerdown)="onBackdropPointerDown($event)">
  <div class="w-80 rounded-lg border border-border bg-surface p-4 text-surface-foreground shadow-xl">
    <h2 class="text-sm font-semibold">{{ req.title }}</h2>
    <p class="mt-2 text-xs text-muted-foreground">{{ req.message }}</p>
    <div class="mt-4 flex justify-end gap-2">
      @if (req.kind === 'confirm') {
      <button #cancelButton type="button" (click)="state.cancel()"
        class="rounded-md px-3 py-1.5 text-xs text-foreground/80 hover:bg-background hover:text-foreground">
        {{ req.cancelLabel }}
      </button>
      }
      <button #confirmButton type="button" (click)="state.confirmAction()"
        [class]="req.tone === 'default'
          ? 'rounded-md bg-primary px-3 py-1.5 text-xs text-primary-foreground hover:opacity-90'
          : 'rounded-md bg-destructive px-3 py-1.5 text-xs text-destructive-foreground hover:opacity-90'">
        {{ req.confirmLabel }}
      </button>
    </div>
  </div>
</div>
}
